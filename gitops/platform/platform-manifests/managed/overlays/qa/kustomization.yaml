apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: ConsoleNotification
      name: banner
    patch: |-
      - op: replace
        path: /spec/backgroundColor
        value: 'purple'
      - op: replace
        path: /spec/text
        value: 'MANAGED (QA)'
