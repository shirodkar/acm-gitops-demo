apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: managed-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: dev-only-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: managed-{{name}}
    spec:
      destination:
        server: "{{server}}"
      project: default
      source:
        path: gitops/platform/platform-manifests/managed/overlays/dev
        repoURL: 'https://github.com/shirodkar/acm-gitops-demo.git'
        targetRevision: argocd-agent
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
